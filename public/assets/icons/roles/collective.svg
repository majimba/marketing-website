<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" fill="none">
  <defs>
    <linearGradient id="collectiveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffc75b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffd700;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Central circle representing the collective -->
  <circle cx="36" cy="36" r="16" fill="url(#collectiveGrad)" stroke="#ffc75b" stroke-width="2"/>
  
  <!-- Surrounding smaller circles representing individual members -->
  <circle cx="20" cy="20" r="6" fill="none" stroke="#ffc75b" stroke-width="2" opacity="0.8"/>
  <circle cx="52" cy="20" r="6" fill="none" stroke="#ffc75b" stroke-width="2" opacity="0.8"/>
  <circle cx="20" cy="52" r="6" fill="none" stroke="#ffc75b" stroke-width="2" opacity="0.8"/>
  <circle cx="52" cy="52" r="6" fill="none" stroke="#ffc75b" stroke-width="2" opacity="0.8"/>
  
  <!-- Connection lines between central and surrounding circles -->
  <line x1="28" y1="28" x2="44" y2="44" stroke="#ffc75b" stroke-width="1.5" opacity="0.6"/>
  <line x1="44" y1="28" x2="28" y2="44" stroke="#ffc75b" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Creative elements: small stars -->
  <path d="M16 36 L18 38 L20 36 L18 34 Z" fill="#ffc75b" opacity="0.7"/>
  <path d="M56 36 L58 38 L60 36 L58 34 Z" fill="#ffc75b" opacity="0.7"/>
  <path d="M36 16 L38 18 L40 16 L38 14 Z" fill="#ffc75b" opacity="0.7"/>
  <path d="M36 56 L38 58 L40 56 L38 54 Z" fill="#ffc75b" opacity="0.7"/>
</svg>
