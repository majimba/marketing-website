<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" fill="none">
  <defs>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffc75b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Central AI brain/neural network -->
  <circle cx="36" cy="36" r="18" fill="none" stroke="url(#aiGrad)" stroke-width="2"/>
  
  <!-- Neural network nodes -->
  <circle cx="30" cy="30" r="3" fill="#ffc75b"/>
  <circle cx="42" cy="30" r="3" fill="#ffc75b"/>
  <circle cx="30" cy="42" r="3" fill="#ffc75b"/>
  <circle cx="42" cy="42" r="3" fill="#ffc75b"/>
  <circle cx="36" cy="36" r="4" fill="url(#aiGrad)"/>
  
  <!-- Connection lines -->
  <line x1="30" y1="30" x2="36" y2="36" stroke="#ffc75b" stroke-width="1.5"/>
  <line x1="42" y1="30" x2="36" y2="36" stroke="#ffc75b" stroke-width="1.5"/>
  <line x1="30" y1="42" x2="36" y2="36" stroke="#ffc75b" stroke-width="1.5"/>
  <line x1="42" y1="42" x2="36" y2="36" stroke="#ffc75b" stroke-width="1.5"/>
  
  <!-- Circuit board elements -->
  <rect x="16" y="16" width="8" height="2" fill="#ffc75b" opacity="0.6"/>
  <rect x="48" y="16" width="8" height="2" fill="#ffc75b" opacity="0.6"/>
  <rect x="16" y="54" width="8" height="2" fill="#ffc75b" opacity="0.6"/>
  <rect x="48" y="54" width="8" height="2" fill="#ffc75b" opacity="0.6"/>
  
  <!-- Data flow indicators -->
  <path d="M24 17 L26 17 L25 15 Z" fill="#ffc75b" opacity="0.8"/>
  <path d="M48 17 L50 17 L49 15 Z" fill="#ffc75b" opacity="0.8"/>
  <path d="M24 55 L26 55 L25 57 Z" fill="#ffc75b" opacity="0.8"/>
  <path d="M48 55 L50 55 L49 57 Z" fill="#ffc75b" opacity="0.8"/>
  
  <!-- Binary code representation -->
  <text x="18" y="68" font-family="monospace" font-size="8" fill="#ffc75b" opacity="0.5">01</text>
  <text x="50" y="68" font-family="monospace" font-size="8" fill="#ffc75b" opacity="0.5">10</text>
</svg>
